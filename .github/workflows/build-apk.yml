name: Build AmazeGoBot APK

on:
  workflow_dispatch:
  push:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Unpack AmazeGoBot
        run: |
          rm -rf phonebuild
          mkdir phonebuild
          unzip -q AmazeGoBot-PhoneBuild.zip -d phonebuild

      - name: Find Android project
        run: |
          echo "Looking for Gradle project..."
          find phonebuild -name gradlew -type f -print

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find phonebuild -name gradlew -type f | head -n 1)")
          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Gradle wrapper (gradlew) was found in the ZIP."
            echo "The ZIP does not appear to contain a complete Android Gradle project."
            exit 1
          fi

          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files found:"
          find phonebuild -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmazeGoBot-APK
          path: phonebuild/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
