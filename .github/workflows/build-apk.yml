name: Build AmazeGoBot APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unpack AmazeGoBot
        run: |
          rm -rf phonebuild
          mkdir phonebuild
          unzip -q AmazeGoBot-PhoneBuild.zip -d phonebuild

      - name: Build APK
        working-directory: phonebuild
        run: gradle --no-daemon assembleDebug

      - name: Show APK
        run: |
          find phonebuild/app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmazeGoBot-debug
          path: phonebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
